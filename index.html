<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>メンセツクエスト ～シャッター商店街の勇者～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--yel:#ffe66d;--cyan:#8be9fd;--red:#ff7b7b;--gray:#9aa3ad;--grn:#9be37a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff}
body{font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;font-size:16px;line-height:1.65;overflow-wrap:anywhere}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:8px 8px 20px;gap:8px;position:relative}
#app.fadein{animation:fadein .35s}
#app.fit{height:100vh;height:100dvh;min-height:0;overflow:hidden;padding:6px 8px 6px;gap:6px}
.hud{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.72);border:2px solid #fff;border-radius:6px;padding:3px 8px;font-size:12px;line-height:1.4;z-index:2}
.hud .hearts{font-size:16px;letter-spacing:1px}
.hud .pop{right:-8px;top:-22px}
@keyframes fadein{from{opacity:0}}
button{font:inherit;color:#fff;background:#000;border:2px solid #fff;border-radius:4px;min-height:48px;padding:8px 12px;text-align:left;touch-action:manipulation;cursor:pointer;width:100%;line-height:1.4}
button:active{background:#2a2a2a}
button.c{text-align:center}
button.y{border-color:var(--yel);color:var(--yel)}
button.sm{min-height:40px;font-size:14px;padding:6px 10px}
.row{display:flex;gap:6px}
.row>button{flex:1}
.win{border:3px solid #fff;border-radius:8px;padding:10px 12px;background:#000;position:relative;box-shadow:inset 0 0 0 2px #000,inset 0 0 0 3px #fff}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--gray);gap:6px}
.topbar .tb{border:1px solid var(--gray);border-radius:4px;padding:4px 7px;color:#ddd;min-height:36px;width:auto;font-size:12px}
.ql{font-size:13px}
.hearts{color:var(--yel);letter-spacing:2px;font-size:18px}
.hearts.bump{animation:bump .4s}
@keyframes bump{30%{transform:scale(1.3)}}
.msg{min-height:8.2em;cursor:pointer;user-select:none;touch-action:manipulation;flex:0 0 auto}
.cmdsWrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.scrollhint{position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.95));text-align:center;color:var(--yel);font-size:12px;line-height:40px;animation:blink 1.2s steps(2) infinite;display:none}
.cmdsWrap.scrollable .scrollhint{display:block}
.nextbtn{position:absolute;right:4px;bottom:2px;width:auto;min-height:36px;padding:2px 12px;border:none;background:transparent;color:#fff;animation:blink 1s steps(2) infinite;font-size:16px}
.speaker{position:absolute;top:-13px;left:10px;background:#000;padding:0 6px;font-size:13px;color:var(--cyan)}
.banner{font-weight:bold;color:var(--yel);animation:shake .5s;margin-bottom:4px}
.banner.bad{color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.flash{animation:flash .5s}
@keyframes flash{0%{background:#fff}100%{background:#000}}
.head{font-size:13px;color:var(--cyan);margin-bottom:2px}
.sub{font-size:14px;color:var(--gray)}
.note{font-size:13px;color:var(--yel);margin-top:4px}
.note.down{color:var(--red)}
.ch{opacity:0;animation:ap 0s forwards}
@keyframes ap{to{opacity:1}}
.done .ch{animation:none!important;opacity:1}
@keyframes blink{50%{opacity:0}}
.cmds{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.tools{display:flex;gap:4px;flex:0 0 auto}
.tools button{flex:1;min-height:40px;font-size:13px;border:1px dashed var(--gray);color:#ddd;background:#111;text-align:center;padding:4px 6px}
.cmdwin{border:3px solid #fff;border-radius:8px;padding:6px 8px;background:#000;position:relative;box-shadow:inset 0 0 0 2px #000,inset 0 0 0 3px #fff;flex:0 0 auto}
.cmdwin .ttl{position:absolute;top:-12px;left:10px;background:#000;padding:0 6px;font-size:12px;color:var(--yel);letter-spacing:.1em;margin:0}
.cmdwin.react{border-color:var(--grn)}
.cmdwin.react .ttl{color:var(--grn)}
.qlist{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.qlist button{border:none;padding:6px 6px 6px 22px;position:relative;font-size:15px;min-height:44px}
.qlist button::before{content:'▶';position:absolute;left:4px;top:6px;color:#fff;opacity:0}
.qlist button:hover::before,.qlist button:focus::before,.qlist button.hl::before{opacity:1}
.qlist button.deep{color:var(--yel);border-top:1px dashed #444;margin-top:4px}
.qt{display:inline-block;font-size:12px;border:1px solid var(--cyan);color:var(--cyan);border-radius:3px;padding:0 5px;margin-right:6px;vertical-align:middle;line-height:1.5}
.qt.warm{border-color:var(--yel);color:var(--yel)}
.legend{font-size:12px;color:var(--gray);border-top:1px dashed #444;margin-top:6px;padding-top:4px}
.legend b{color:var(--yel);font-weight:normal}
.hl{background:var(--yel)!important;color:#000!important;border:2px solid #fff!important;animation:pulse 1s infinite;border-radius:4px;position:relative}
.hl .qt{border-color:#000;color:#000}
.hl::before{color:#000!important;opacity:1!important}
.tools button.hl::after,.qlist button.hl::after{content:' 👈 おす';font-size:12px}
.overlay button.hl::after,.row button.hl::after,.c.hl::after{content:' 👈 おす';font-size:12px}
@keyframes pulse{50%{filter:brightness(.7)}}
.dimmed{opacity:.3;pointer-events:none}
.caption{border:2px solid var(--yel);border-radius:6px;padding:8px 10px;font-size:14px;color:var(--yel);background:#111;display:flex;gap:8px;align-items:flex-start}
.caption b{color:#fff}
.caption .cv{flex:0 0 auto}
.clipbtn{display:inline;width:auto;min-height:0;padding:0;border:none;border-bottom:1px dotted #999;border-radius:0;background:transparent;text-align:left;font-size:inherit;color:inherit;line-height:inherit;touch-action:manipulation}
.hint{font-size:13px;color:var(--gray)}
.ttl{color:var(--yel);font-size:14px;letter-spacing:.1em;margin-bottom:4px}
.small{font-size:13px;color:var(--gray)}
h2{font-size:18px;color:var(--yel);margin:4px 0;letter-spacing:.1em}
.foot{font-size:12px;color:#999;text-align:center;margin-top:auto;padding-top:12px}
@media print{body{background:#fff;color:#000;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif}.win,.cmdwin{border-color:#000;box-shadow:none;background:#fff}.topbar,button,.sky,.px{display:none!important}.ttl,.small,.ql,.an{color:#333}}
.pushstart{text-align:center;font-size:15px;color:var(--yel);letter-spacing:.2em;animation:blink 1.1s steps(2) infinite;margin-top:6px}
.sky{position:absolute;inset:0;z-index:-1;background:
 radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 55% 25%,#ffe66d 50%,transparent 51%),
 radial-gradient(1px 1px at 72% 60%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 88% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 45%,#8be9fd 50%,transparent 51%),
 radial-gradient(1px 1px at 20% 90%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 80% 85%,#fff 50%,transparent 51%),linear-gradient(#000 0%,#0a0f2a 60%,#1b1f3a 100%)}
/* logo */
.logowrap{text-align:center;margin:26px 0 6px;position:relative;transform:skewX(-6deg)}
.lg,.lg-sh{font-size:44px;font-weight:bold;line-height:1.05;letter-spacing:.02em;white-space:nowrap}
.lg-sh{position:absolute;left:3px;top:3px;width:100%;color:#5a3a00;z-index:0}
.lg{position:relative;z-index:1}
.lg .l{display:inline-block;background:linear-gradient(180deg,#fff9d6 0%,#ffe066 30%,#c98a00 50%,#ffe066 62%,#fffbe6 100%);background-size:100% 300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both,shine 3.5s ease-in-out infinite alternate}
.lg-sh .l{display:inline-block;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{from{transform:translateY(-50px) scale(1.3);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{from{background-position:0 0}to{background-position:0 100%}}
.band{display:inline-block;background:var(--yel);color:#000;padding:2px 16px;font-size:14px;letter-spacing:.2em;margin-top:10px;animation:drop .7s .9s cubic-bezier(.2,1.5,.4,1) both}
.star{position:absolute;color:#fff;font-size:14px;animation:tw 1.6s infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}
/* avatar */
.px{display:grid;grid-template-columns:repeat(12,4px);grid-auto-rows:4px;image-rendering:pixelated}
.px.big{grid-template-columns:repeat(12,6px);grid-auto-rows:6px}
.px.hero{grid-template-columns:repeat(12,7px);grid-auto-rows:7px}
.herowrap{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:14px 0 2px;min-height:120px}
.hero{animation:jump 1.3s cubic-bezier(.3,0,.2,1) infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.6))}
@keyframes jump{0%,100%{transform:translateY(0)}18%{transform:translateY(-26px) rotate(-5deg)}36%{transform:translateY(0)}52%{transform:translateY(-10px)}66%{transform:translateY(0)}}
.bubble{border:2px solid #fff;border-radius:8px;padding:4px 10px;font-size:14px;background:#000;position:relative;margin-bottom:60px;animation:blink 2.2s steps(2) infinite}
.bubble::after{content:'';position:absolute;left:-10px;bottom:8px;border:5px solid transparent;border-right-color:#fff}
.px i{display:block}
/* stage */
.stage{position:relative;height:160px;border:3px solid #fff;flex:0 0 auto;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 2px #000,inset 0 0 0 3px #fff;
 background:linear-gradient(180deg,var(--wall,#3b3f66) 0 62%,#2b2b2b 62% 68%,var(--floor,#5a4634) 68% 100%)}
.stage::before{content:'';position:absolute;left:0;right:0;top:0;height:62%;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.05) 22px 24px),repeating-linear-gradient(0deg,transparent 0 14px,rgba(0,0,0,.12) 14px 16px)}
.stage .counter{position:absolute;left:8%;right:8%;top:58%;height:22px;background:#7a5a3a;border:2px solid #2b1b0b;border-radius:3px}
.stage .counter::after{content:'';position:absolute;left:0;right:0;top:4px;height:3px;background:rgba(255,255,255,.25)}
.stage .sign{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#1b1b1b;color:var(--yel);font-size:12px;padding:1px 10px;border:2px solid #777;border-radius:3px;white-space:nowrap}
.stage .sprite{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.stage .sprite.in{animation:enter .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes enter{from{transform:translateX(-50%) translateY(40px);opacity:0}70%{transform:translateX(-50%) translateY(-8px)}to{transform:translateX(-50%);opacity:1}}
.stage.hit{animation:shake .5s}
.stage.glow{animation:glow .7s}
@keyframes glow{0%{box-shadow:inset 0 0 0 2px #000,inset 0 0 0 3px #fff,inset 0 0 80px rgba(255,230,109,.9)}100%{box-shadow:inset 0 0 0 2px #000,inset 0 0 0 3px #fff}}
.stage.gone .sprite{animation:leave .5s forwards}
@keyframes leave{to{transform:translateX(-50%) translateX(260px);opacity:0}}
/* result fx */
.stage.fxwait{filter:brightness(.6)}
.stage.fxboom{--wall:#8a6a10;--floor:#a07a2a;animation:goldpulse 1.2s infinite alternate}
@keyframes goldpulse{from{box-shadow:inset 0 0 0 2px #000,inset 0 0 0 3px #fff,inset 0 0 40px rgba(255,230,109,.5)}to{box-shadow:inset 0 0 0 2px #000,inset 0 0 0 3px #fff,inset 0 0 90px rgba(255,230,109,.9)}}
.stage.fxboom .sprite{animation:happy .6s infinite alternate}
@keyframes happy{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-18px)}}
.stage.fxsoso{filter:brightness(.75);animation:flicker 2s infinite}
@keyframes flicker{0%,100%{filter:brightness(.75)}45%{filter:brightness(.75)}50%{filter:brightness(.4)}55%{filter:brightness(.75)}}
.stage.fxclose{filter:brightness(.5)}
.stage.fxclose .sprite{animation:fadeout 1.4s forwards}
@keyframes fadeout{to{opacity:0}}
.stage.fxdecline .sprite{animation:leave .9s forwards}
.stage.fxthink .sprite{animation:think 1.1s ease-in-out infinite alternate}
@keyframes think{from{transform:translateX(-50%) rotate(-4deg)}to{transform:translateX(-50%) rotate(4deg)}}
.stage.fxthink::after{content:'……';position:absolute;left:calc(50% + 34px);top:22px;background:#fff;color:#111;padding:1px 8px;border-radius:10px;font-size:14px;font-weight:bold;animation:blink 1s steps(2) infinite;z-index:3}
.stage.fxaccept{animation:goldpulse .8s 4 alternate}
.stage.fxaccept .bigbanner{top:24%}
.stage.fxaccept .sprite{animation:happy .4s 8 alternate}
.stage.fxaccept::after{content:'！';position:absolute;left:calc(50% + 34px);top:14px;color:var(--yel);font-size:28px;font-weight:bold;animation:popup 1.1s forwards;z-index:3}
.stage.fxbow .sprite{animation:bow 1.6s ease-in-out forwards}
@keyframes bow{0%{transform:translateX(-50%)}35%{transform:translateX(-50%) translateY(8px) scaleY(.88)}70%{transform:translateX(-50%) translateY(8px) scaleY(.88)}100%{transform:translateX(-50%)}}
.stage.fxdeclined .sprite{animation:leaveSlow 1.8s ease-in forwards}
@keyframes leaveSlow{0%{transform:translateX(-50%);opacity:1}60%{opacity:1}100%{transform:translateX(-50%) translateX(260px);opacity:0}}
.shutter{position:absolute;left:0;right:0;top:0;height:0;background:repeating-linear-gradient(0deg,#5a5a5a 0 6px,#3a3a3a 6px 10px);border-bottom:4px solid #222;z-index:3;animation:shutdown 1.3s cubic-bezier(.4,0,1,1) .3s forwards}
@keyframes shutdown{to{height:100%}}
.bigbanner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);font-size:30px;font-weight:bold;color:var(--yel);text-shadow:3px 3px 0 #000,0 0 12px rgba(255,230,109,.8);z-index:4;animation:bang .7s cubic-bezier(.2,1.6,.4,1) .2s forwards;white-space:nowrap}
.bigbanner.bad{color:var(--red);animation-delay:1.3s;text-shadow:3px 3px 0 #000}
.bigbanner.dim{color:#ccc}
@keyframes bang{to{transform:translate(-50%,-50%) scale(1)}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.confetti i{position:absolute;top:-10px;width:6px;height:10px;animation:fall 1.6s linear infinite}
@keyframes fall{to{transform:translateY(180px) rotate(360deg)}}
#app.shake{animation:shake .6s}
#app.goldflash{animation:goldflash .8s}
@keyframes goldflash{0%{background:#ffe66d}100%{background:transparent}}
/* map storefront */
.front .bay{position:relative;height:48px;margin:4px 8px 0;border:2px solid #222;overflow:hidden;background:#111}
.front .shopwin{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,#ffe66d,#ffb347)}
.front.soso .shopwin{background:linear-gradient(180deg,#8a7a3a,#5a4a1a)}
.front.close .shopwin{background:#444;filter:grayscale(1) brightness(.6)}
.front .shopwin .px{transform:translateY(8px)}
.front .shut2{position:absolute;left:0;right:0;top:0;height:100%;background:repeating-linear-gradient(0deg,#555 0 4px,#3a3a3a 4px 7px);border-bottom:3px solid #222;z-index:1}
.front.boom .shut2,.front.soso .shut2{height:0}
.front.anim.boom .shut2,.front.anim.soso .shut2{animation:rollup 1.2s .2s forwards;height:100%}
@keyframes rollup{to{height:0}}
.front.anim.close .shut2{height:0;animation:rolldown 1.2s 1s forwards}
@keyframes rolldown{to{height:100%}}
.front.boom .bay{box-shadow:0 0 14px rgba(255,220,100,.8)}
.front.boom::after{content:'✦';position:absolute;top:2px;left:4px;color:#fff;font-size:12px;animation:tw 1.6s infinite}
.front.anim.boom .st,.front.anim.soso .st,.front.anim.close .st{animation:fadein 1.4s}
/* credits */
.creditsWrap{position:relative;flex:1;min-height:52vh;min-height:52dvh;overflow:hidden;border:3px solid #fff;border-radius:8px;box-shadow:inset 0 0 0 2px #000,inset 0 0 0 3px #fff;background:linear-gradient(#000,#0a0f2a)}
.roll{position:absolute;left:0;right:0;top:100%;text-align:center;font-size:15px;line-height:1.9;padding:0 12px;animation:roll linear forwards}
@keyframes roll{to{transform:translateY(calc(-100% - 60vh))}}
.roll .cl.h{color:var(--yel);font-size:18px;letter-spacing:.1em;margin:6px 0}
.roll .cl.s{color:var(--cyan);margin-top:6px}
.status{display:flex;justify-content:space-between;align-items:center;border:3px solid #fff;border-radius:8px;box-shadow:inset 0 0 0 2px #000,inset 0 0 0 3px #fff;padding:6px 12px;font-size:14px;position:relative}
.pop{position:absolute;right:14px;top:-16px;font-size:15px;font-weight:bold;color:var(--yel);animation:popup 1.1s forwards;pointer-events:none}
.pop.neg{color:var(--red)}
@keyframes popup{from{opacity:0;transform:translateY(8px)}25%{opacity:1}to{opacity:0;transform:translateY(-18px)}}
.tools button.used{opacity:.45}
.tools button.warn{border-color:#a55;color:#f8b4b4}
.status{flex-wrap:wrap}
.evrow{flex-basis:100%;display:flex;align-items:center;gap:6px;margin-top:5px;padding-top:4px;border-top:1px dashed #666;font-size:12px}
.evrow .el{color:var(--cyan);white-space:nowrap}
.evrow .el b{font-size:16px}
.ebar{position:relative;flex:0 0 72px;height:7px;border:2px solid #fff;background:#1a1a1a}
.ebar i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);transition:width .5s}
.mot{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.15;vertical-align:middle}
.mot .dtxt{font-size:12px;font-weight:bold}.mot .dtxt.up{color:var(--grn)}.mot .dtxt.down{color:var(--red)}
.mot .mbar .dl{position:absolute;top:0;bottom:0}.mot .mbar .dl.up{background:var(--grn);animation:dlfade 2.2s forwards}.mot .mbar .dl.down{background:var(--red)}
@keyframes dlfade{from{opacity:1}to{opacity:0}}
.msg.fup{animation:frameUp .4s}.msg.fdown{animation:frameDown .4s}
@keyframes frameUp{0%{box-shadow:0 0 0 3px var(--grn)}100%{box-shadow:none}}
@keyframes frameDown{0%{box-shadow:0 0 0 3px var(--red)}100%{box-shadow:none}}
.stage .lampL{position:absolute;left:12px;top:44px;width:10px;height:10px;border-radius:50%;background:#444;border:2px solid #222;z-index:2}
.stage.lit .lampL{background:#ffe66d;box-shadow:0 0 12px #ffe66d;animation:lampOn .5s}
@keyframes lampOn{from{transform:scale(1.8)}to{transform:scale(1)}}
.stage .todov{position:absolute;inset:0;pointer-events:none;z-index:1}
.stage.tod0 .todov{background:linear-gradient(rgba(255,230,160,.16),rgba(255,230,160,0) 60%)}
.stage.tod2 .todov{background:linear-gradient(rgba(20,10,60,.38),rgba(20,10,60,.14))}
.stage.tod2 .sign{box-shadow:0 0 10px rgba(255,230,109,.6)}
.stage .sign .tod{color:#aaa;font-size:11px}
.ecard{border:2px solid var(--cyan);border-radius:6px;padding:6px 10px;margin:4px 0 6px;font-size:13px;line-height:1.6;background:#06141c}
.ecard .ec1{font-size:14px}.ecard .tg{display:inline-block;border:1px solid #666;border-radius:3px;padding:0 4px;font-size:11px;margin:1px 0}.ecard .ar{color:#777;margin:0 2px}
.ecard .ok{color:var(--yel)}.ecard .ng{color:var(--red)}.ecard .ec4{color:#9a9;font-size:12px;margin-top:2px}
.townsay{display:flex;align-items:center;gap:8px;margin:6px 0}.townsay .px{flex:0 0 auto}.tbub{flex:1;border:2px solid #fff;border-radius:8px;padding:5px 10px;font-size:13px;background:#000;position:relative}
.tbub::before{content:'';position:absolute;left:-10px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:#fff}
.cmds > :first-child{margin-top:auto}
.memohead{position:sticky;top:0;background:#000;z-index:2}
@media (max-width:400px){.topbar .tb{font-size:11px;padding:3px 5px;min-height:32px}}
@media (max-height:760px),(max-width:520px){#app.compact .stage{height:64px;transition:height .25s}#app.compact .stage .sprite{transform:translateX(-50%) scale(.55);transform-origin:50% 100%;bottom:2px}#app.compact .stage .counter{top:62%;height:12px}#app.compact .stage .lampL{top:30px}#app.compact .msg{min-height:4.5em}#app.compact .stage .todov{display:none}}
.mot .ml{font-size:12px;color:#ddd}
.mot .mv{font-size:20px;color:var(--yel)}

<script>
'use strict';
/* =========================================================

 h+='<div class="win"><div class="ttl">まとめ</div><div class="small">称号：'+esc(S.title)+'／はんじょう '+S.boom+'／★ '+S.starsFound+'/'+(S.shops*2)+'／ふかぼり '+S.deepTotal+'回／NG '+S.ngCount+'回／じたい '+S.declined+'回／りれきしょ '+S.resumeViewed+'/'+(S.shops*2)+'／第一印象どおりの採用 '+S.impHires+'/'+S.hires+'</div>'+axisHTML(S)+'</div>';
 S.recs.forEach(r=>{const s=shopById(r.shopId); const hiredName=r.hired?appById(r.hired).name:'—'; h+='<div class="win"><div class="ttl">'+s.emoji+' '+esc(s.name)+'</div>'+memoHTML(s,r.applicants,true)+'<div class="small" style="margin-top:6px">判断：'+(r.outcome==='skip'?'みおくり':'さいよう '+esc(hiredName))+'　→　'+esc(DATA.gradeName[r.outcome])+'</div></div>';});
 h+='<div class="win"><div class="ttl">こうひょう（全件）</div>'+(S.allBoom?'<div>'+esc(DATA.allBoomText)+'</div>':(S.reviews.length?'<ul class="rev">'+S.reviews.map(r=>'<li>'+esc(r.text)+'</li>').join('')+'</ul>':'<div class="small">とくに なし</div>'))+'</div>';
 h+=kokoroeHTML(S);
 const qs=reflectQuestions(S);
 h+='<div class="win"><div class="ttl">ふりかえりの 3つの問い</div>'+qs.map((q,i)=>'<div style="margin:6px 0"><div style="font-size:14px">'+(i+1)+'. '+esc(q)+'</div><textarea class="reflect" data-i="'+i+'" rows="3" placeholder="ここに 書く（この端末に 自動保存）" style="width:100%;font:inherit;font-size:14px;background:#111;color:#fff;border:1px solid #666;border-radius:4px;padding:6px;margin-top:4px">'+esc(LS.get('mq_reflect_'+i)||'')+'</textarea></div>').join('')+'</div>';
 h+='<div class="row"><button class="c sm" data-act="copyReview">ふりかえりを コピー</button><button class="c sm" data-act="backEnding">けっかへ もどる</button></div>';
 return h;}
function reflectQuestions(S){const m0=S.missed[0]; const cl0=m0?(clueText(m0.a.id)||'気になるところ').replace(/。$/,'').slice(0,30):''; const q1=m0?(m0.a.data.name+'の '+(m0.kind==='hollow'?'答え（'+m0.text.slice(0,20)+'…）の 中身を たしかめなかった':(m0.kind==='concern'?'打ち明け話':'本音')+'（'+m0.text.slice(0,20)+'…）を 逃した')+'。'+(cl0.startsWith('「')?cl0:'「'+cl0+'」')+'を、現場の あなたなら どう 聞きますか'):'全員の 本音を 聞けた。次の 面接で、最初に 聞く「過去の 行動」の 質問は 何にしますか';
 const bad=S.apps.filter(a=>a.react.some(x=>x==='rebut'||x==='self')).map(a=>a.data.name); const q2=bad.length?('反論・自分語りを した場面（'+bad.join('・')+'）で、応募者の 答えは どう 変わりましたか。別の 反応なら どうなったと 思いますか'):DATA.reflectQ[1];
 return [q1,q2,DATA.reflectQ[2]];}
function reviewText(){const S=stats(); const L=['メンセツクエスト ふりかえり','称号｜'+S.title,'はんじょう｜'+S.boom+'｜★｜'+S.starsFound+'/'+(S.shops*2)+'｜NG｜'+S.ngCount+'｜じたい｜'+S.declined+'｜りれきしょ｜'+S.resumeViewed+'/'+(S.shops*2)+'｜印象どおり｜'+S.impHires+'/'+S.hires,'見極め｜過去'+S.factAsked+'回｜将来等'+S.softAsked+'回｜魅力づけ｜平均しぼうど'+S.avgMot+'｜傾聴'+S.listenCount+'｜共感'+S.empathyCount+'｜反論'+S.rebutCount];
 S.recs.forEach((r,i)=>{const s=shopById(r.shopId); s.applicants.forEach(a=>{const x=r.applicants[a.id]; const seq=[]; x.asked.forEach(q=>{const qq=Q(q,s,a); seq.push(qq?qq.label:q); if(x.deepOn.includes(q)) seq.push('ふかぼり');}); L.push('①②③'[i]+s.short+'｜'+a.name+'｜'+(x.resumeViewed?'りれきしょ→':'')+(seq.join('→')||'（なし）')+'｜反応:'+(x.react.map(id=>R(id).name).join('・')||'なし')+'｜'+(x.stars.length?'★':'★なし')+'｜'+(r.hired===a.id?'採用｜'+DATA.gradeName[r.outcome]:(r.outcome==='skip'?'みおくり':'不採用')));});});
 const k=DATA.kokoroe.map((kk,i)=>S.k[kk.when]?null:(i+1)).filter(Boolean); L.push('こころえ｜'+(DATA.kokoroe.length-k.length)+'/'+DATA.kokoroe.length+'｜未取得：'+(k.join(',')||'なし'));
 S.kimete.forEach(km=>L.push('決め手｜'+km.a.data.name+'｜'+km.mark+' '+kindLabel(km.kind)+'｜'+km.text.slice(0,30)));
 reflectQuestions(S).forEach((q,i)=>L.push('問'+(i+1)+'｜'+q+'｜'+(LS.get('mq_reflect_'+i)||'（未記入）').replace(/\n/g,' ')));
 if(state.exam) L.unshift('【ヒントなしモード】'); L.unshift('名前｜'+playerName()); return L.join('\n');}
function resultText(){const S=stats(); return [DATA.title+' ～'+DATA.subtitle+'～','称号：'+S.title+(S.shops<S.total?'（'+S.shops+'店舗まで）':''),'はんじょう '+S.boom+'店 ／ 見抜いた本音 '+S.starsFound+'/'+(S.shops*2)+' ／ 平均しぼうど '+S.avgMot,'「'+(S.shops<S.total?'まだ '+(S.total-S.shops)+'つの シャッターが のこっている':S.ending)+'」',location.href.split('?')[0]].join('\n');}
function doCopy(t){state.copyText=t; const show=()=>{state.overlay='copied'; render();}; if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(show,show);} else show();}
function facText(){const L=['【講師用】メンセツクエスト 進行台本',''];
 allShops().forEach(s=>{L.push('■ '+s.name+(s.demoTitle?'（お手本・'+s.demoTitle+'）':'')); if(s.rjp) L.push('店の条件：'+s.rjp);
  s.applicants.forEach(a=>{L.push('--- '+a.name+'（'+a.age+'）'+a.label+'　結果：'+DATA.gradeName[a.result.grade]+'　初期しぼうど '+a.motivation+(a.tags.length?'　タグ '+a.tags.join(','):'')); L.push('気になるところ：'+(DATA.clues[a.id]||'')); L.push('第一印象：'+a.impression);
   a.hand.forEach(id=>{const q=Q(id,s,a); if(!q) return; L.push('Q['+(DATA.qTag[q.type]||q.type)+'] '+q.text); if(q.type==='ng'){L.push('  → NG応答'); return;} const ans=a.answers[id]; if(!ans){L.push('  （答えなし）'); return;} L.push('  '+a.name+'「'+ans.text+'」'); const d=ans.deep; const pr=(d&&d.prompt)||q.deepPrompt||(q.tellsCondition?DATA.deepPrompt.cond:(q.type==='hypo'?DATA.deepPrompt.hypo:(DATA.deepPrompt[q.type]||DATA.deepPrompt.other))); L.push('  ふかぼり「'+pr+'」'); if(d) L.push('    '+a.name+'「'+d.text+'」'+(d.star?' ★'+(d.kind||'good'):'')+(d.motivation!=null?' ('+d.motivation+')':'')+(d.convert?' 過去に変換':'')); else L.push('    '+a.name+'「'+(q.shallow||'……')+'」 (−5)');});
   if(a.rjpReply) L.push('店の条件への返答：「'+a.rjpReply.text+'」('+a.rjpReply.mot+')'); L.push('半年後：'+a.result.text); L.push('');});});
 L.push('■ 講評の条件'); DATA.reviews.forEach(r=>L.push('・['+r.when+'] '+r.text)); L.push('','■ こころえの条件'); DATA.kokoroe.forEach(k=>L.push('・['+k.when+'] '+k.game+' → '+k.real));
 L.push('','■ 反応 × 答えの種類（しぼうどの増減）'); DATA.reactions.forEach(rc=>L.push('・'+rc.name+'：'+(rc.mot.all!=null?('すべて '+rc.mot.all+(rc.guard?'（本音を閉ざす）':'')+(rc.repeatMot!=null?'、続けると '+rc.repeatMot:'')):Object.keys(rc.mot).map(k=>DATA.kindName[k]+' '+rc.mot[k]).join('／'))));
 L.push('','■ 講師用URL：?start=s1|s2|s3|demo（指定の店から開始）／?shops=N（N店で終了）／?unlock=1（章を全部表示）／?mode=exam（ヒントなし）／?fac=1（この画面）／?dev=1（デバッグ）'); return L.join('\n');}
function renderFac(){let h=topbar('こうし用')+'<h2>講師用（進行台本）</h2><div class="row"><button class="c sm" data-act="copyFac">講師用を コピー</button><button class="c sm" data-act="title">タイトルへ</button></div><div class="small">ブラウザの印刷（Ctrl+P）で 白背景・標準フォントで 印刷できます。URL：?start=s1|s2|s3|demo／?shops=N／?unlock=1／?mode=exam</div>';
 allShops().forEach(s=>{h+='<div class="win"><div class="ttl">'+s.emoji+' '+esc(s.name)+(s.demoTitle?'（会長の お手本・'+esc(s.demoTitle)+'）':'')+'</div><div class="small">専用質問：'+esc(s.own.text)+(s.rjp?'<br>店の条件：'+esc(s.rjp):'')+'</div>'+s.applicants.map(a=>{const sq=Object.keys(a.answers).find(k=>a.answers[k].deep&&a.answers[k].deep.star); let d='<div style="margin-top:8px;border-top:1px solid #333;padding-top:6px">'+avatar(a.av)+' <b>'+esc(a.name)+'</b>（'+a.age+'）'+esc(a.label)+'　→ '+esc(DATA.gradeName[a.result.grade])+'<br><span class="small">★：'+esc(sq?Q(sq,s,a).label:'なし')+'（'+esc(sq?kindLabel(a.answers[sq].deep.kind||'good'):'')+'）／第一印象：'+(a.good?'良':'普通')+'／しぼうど初期値 '+a.motivation+(a.tags.length?'／タグ '+a.tags.join(','):'')+'<br>気になるところ：'+esc(DATA.clues[a.id]||'')+'</span>';
   a.hand.forEach(id=>{const q=Q(id,s,a); if(!q) return; const ans=a.answers[id]; d+='<div class="qb"><div class="ql">['+esc(DATA.qTag[q.type]||q.type)+'] '+esc(q.text)+'</div>'; if(q.type==='ng'){d+='<div class="ar"><span class="an">—</span>NG応答</div></div>'; return;} if(!ans){d+='</div>'; return;} d+='<div class="ar"><span class="an">'+esc(a.name)+'</span><span>'+esc(ans.text)+'</span></div>'; const dp=ans.deep; d+='<div class="ar dr"><span class="an">'+(dp&&dp.star?(dp.kind==='good'||!dp.kind?'★':'⚠'):'└')+'</span><span>'+esc(dp?dp.text:(q.shallow||''))+(dp?(dp.motivation!=null?'（'+dp.motivation+'）':''):'（−5）')+'</span></div></div>';});
   d+='<div class="small" style="margin-top:4px">半年後：'+esc(a.result.text)+'</div></div>'; return d;}).join('')+'</div>';});
 h+='<div class="win"><div class="ttl">質問の種類</div>'+DATA.questions.map(q=>'<div class="small">'+q.id+' ['+q.type+'] '+esc(q.text)+'</div>').join('')+'<div class="ttl" style="margin-top:8px">反応（魅力づけ）</div>'+DATA.reactions.map(r=>'<div class="small">'+esc(r.name)+'　'+(r.mot.all!=null?((r.mot.all>0?'+':'')+r.mot.all):Object.keys(r.mot).map(k=>DATA.kindName[k]+(r.mot[k]>0?'+':'')+r.mot[k]).join('／'))+(r.guard?'（次のふかぼりで本音を閉ざす）':'')+'</div>').join('')+'</div><button class="c" data-act="title">タイトルへ</button>'; return h;}

/* ---- actions ---- */
const ACT={
 tap:()=>tapWindow(), sound:()=>{LS.set('mq_sound',soundOn()?'off':'on'); if(soundOn()) sfx('select'); render();},
 start:()=>press(()=>{state.overlay=null; sfx('up'); startGame();}), continue:()=>continueGame(), newConfirm:()=>{state.overlay='newConfirm'; render();},
 next:()=>press(nextShop), endNow:()=>press(()=>showEnding(true)),
 ask:(q)=>press(()=>ask(q)), deep:()=>press(deep), react:(id)=>press(()=>react(id)), hint:()=>press(hint),
 endEarly:()=>press(()=>{ const r=curRec(); if(state.demo||r.turnsLeft<=0){endInterview(true); return;} const t=r.asked.length===0?'まだ しつもんを 1つも していません。それでも めんせつを おえますか？':'しつもんが あと '+r.turnsLeft+'回 のこっています。めんせつを おえますか？'; say([{text:t,choices:[{label:'はい、おえる',act:'doEndEarly'},{label:'いいえ、つづける',act:'backCmds'}]}]); }),
 resume:()=>press(openResume), memo:()=>press(openMemo), rjp:()=>press(rjpTell), closeOv:()=>closeOverlay(),
 hire:(id)=>press(()=>{ hire(id); }),
 kimeteSel:(arg)=>press(()=>{ const id=state.pendingHire; if(!id) return; const r=state.cur.recs[id]; r.kimete=arg; state.overlay=null; hire(id); }),
 skip:()=>press(skipShop), doSkip:()=>press(doSkip), backMemo:()=>press(backMemo),
 pause:()=>pauseGame(), skipDemo:()=>{state.overlay='skipDemoConfirm'; render();}, doSkipDemo:()=>press(skipDemoNow), skipOpening:()=>press(startPrologue),
 doChapter:()=>press(()=>{const id=state.pendingChapter; state.overlay=null; if(id) startFrom(id);}),
 doEndEarly:()=>press(()=>endInterview(true)), backCmds:()=>press(()=>{state.msg={text:'めんせつを つづける。'}; state.msgDone=true; state.showCmds=true; render();}),

 skipAll:()=>{ if(isTyping()) completeMsg(); if(queue.length>0){ while(queue.length>1) queue.shift(); showNext(); } },
 review:()=>showReview(), backEnding:()=>backEnding(), replay:()=>replay(), title:()=>toTitle(), fac:()=>{state.phase='fac'; render();}, jump:(id)=>press(()=>jumpTo(id)), chapter:(id)=>press(()=>{ if(loadSave()){state.pendingChapter=id; state.overlay='chapterConfirm'; render();} else startFrom(id); }), skipCredits:()=>endCredits(), devCredits:(n)=>press(()=>debugCredits(parseInt(n,10)||0)),
 copyResult:()=>doCopy(resultText()), copyReview:()=>doCopy(reviewText()), copyKanpe:()=>doCopy(kanpeText()), copyFac:()=>doCopy(facText()), nginfo:()=>{state.overlay='nginfo'; render();}, rules:()=>{state.overlay='rules'; render();},
 zukan:()=>{state.zukanBack=(state.phase==='ending'||state.phase==='review')?state.phase:null; state.phase='zukan'; render(); window.scrollTo(0,0);}, zukanBack:()=>{state.phase=state.zukanBack||'ending'; state.zukanBack=null; render(); window.scrollTo(0,0);}, pickName:(n)=>press(()=>{LS.set('mq_name',n); state.phase='opening'; persist(); render(); window.scrollTo(0,0);}), nameInput:()=>{const el=document.getElementById('nameIn'); if(!el) return; const v=el.value.replace(/[\s\u3000]/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); const err=document.getElementById('nameErr'); if(!/^[ぁ-ゖー]{1,6}$/.test(v)){ if(err) err.textContent=v?'ひらがな だけで 入れてください（6文字まで）':'なまえを 入れてください'; el.focus(); return;} ACT.pickName(v);},
 examToggle:()=>{LS.set('mq_exam',LS.get('mq_exam')==='on'?'off':'on'); render();},
 reflect:()=>{}
};
$app.addEventListener('input',e=>{const t=e.target; if(t&&t.classList&&t.classList.contains('reflect')) LS.set('mq_reflect_'+t.dataset.i,t.value);});
$app.addEventListener('click',e=>{ensureAudio(); setTimeout(syncBgm,250); const cl=e.target.closest('.clipbtn'); if(cl){const open=cl.dataset.open==='1'; cl.textContent=open?cl.dataset.short:cl.dataset.full; cl.dataset.open=open?'0':'1'; cl.setAttribute('aria-label',open?'全文を見る':'短くする'); e.stopPropagation(); return;}
 const stop=e.target.closest('[data-stop]'); const el=e.target.closest('[data-act]'); if(!el){ if(document.getElementById('msgbox')&&!state.overlay&&!e.target.closest('input,textarea,button,a,.cmdsWrap')) tapWindow(); return; } if(stop&&el.classList.contains('overlay')) return; const act=el.dataset.act, arg=el.dataset.arg;
 if(state.demo&&!demoAllowed(act,arg)) return;
 const wasDemoStep=state.demo&&demoExpected()&&demoExpected().act===act&&!(act==='closeOv'&&FREE_OVERLAYS.includes(state.overlay));
 if(ACT[act]) ACT[act](arg);
 if(wasDemoStep&&state.demo){ demoAfter(); render(); }
 if(state.phase!=='title') persist();});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='nameIn'){ if(e.key==='Enter'){e.preventDefault(); ACT.nameInput();} return;} if(e.target&&e.target.tagName&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return; if(e.key==='Enter'||e.key===' '){ if(state.overlay) return; if(e.target&&e.target.closest&&e.target.closest('button,a,[tabindex]')) return; const b=document.getElementById('msgbox'); if(b){e.preventDefault(); tapWindow();} }});
function applyDialog(){try{const o=(typeof DIALOG!=='undefined')?DIALOG:null; if(!o) return; DATA.demoShops.concat(DATA.shops).forEach(s=>s.applicants.forEach(a=>{const d=o[a.id]; if(!d) return; Object.keys(d).forEach(q=>{const src=d[q]; if(!src) return; const dst=a.answers[q]=a.answers[q]||{text:'……'}; if(src.text) dst.text=src.text; if(src.shallow) dst.shallow=src.shallow; if(src.opts&&src.opts.length) dst.opts=src.opts; if(src.deep&&dst.deep){ if(src.deep.prompt) dst.deep.prompt=src.deep.prompt; if(src.deep.text) dst.deep.text=src.deep.text; if(src.deep.opts&&src.deep.opts.length) dst.deep.opts=src.deep.opts; }});}));}catch(e){}}
applyDialog(); state=newState(); render();
(function(){const u=new URLSearchParams(location.search); if(u.get('mode')==='exam') LS.set('mq_exam','on'); if(u.get('unlock')==='1') LS.set('mq_unlock','1'); if((u.get('mode')==='exam'||u.get('unlock')==='1')&&state&&state.phase==='title') render();
 const j=u.get('jump'); if(j){jumpTo(j); return;}
 const st=u.get('start'); if(st){ if(!LS.get('mq_name')) LS.set('mq_name','ゆうしゃ'); if(st==='demo') startFrom('demo:0'); else {const i=DATA.shops.findIndex(s=>s.id===st); if(i>=0) startFrom('shop:'+i);} const n=parseInt(u.get('shops')||'0',10); if(n>0&&state){state.maxShops=n; persist(); render();} }})();
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&state&&state.overlay&&state.overlay!=='kimete'){ if(!state.demo||FREE_OVERLAYS.includes(state.overlay)||state.overlay==='resume'){closeOverlay();} } });
