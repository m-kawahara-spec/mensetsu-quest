<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#000;--fg:#fff;--yel:#ffe66d;--cyan:#8be9fd;--red:#ff7b7b;--gray:#9aa3ad;--dim:#333}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff}
body{font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;font-size:16px;line-height:1.65;overflow-wrap:anywhere}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:8px 8px 20px;gap:8px}
button{font:inherit;color:#fff;background:#000;border:2px solid #fff;border-radius:4px;min-height:48px;padding:8px 12px;text-align:left;touch-action:manipulation;cursor:pointer;width:100%;line-height:1.4}
button:active{background:#2a2a2a}
button.c{text-align:center}
button.y{border-color:var(--yel);color:var(--yel)}
button.sm{min-height:40px;font-size:14px;padding:6px 10px}
button.q{font-size:15px}
.row{display:flex;gap:6px}
.row>button{flex:1}
.win{border:3px solid #fff;border-radius:6px;padding:10px 12px;background:#000;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--gray)}
.topbar .sp{border:1px solid var(--gray);border-radius:4px;padding:4px 10px;color:#ddd;min-height:36px;width:auto;font-size:13px}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.hearts{color:var(--yel);letter-spacing:2px;font-size:18px}
.msg{min-height:8.2em;cursor:pointer;user-select:none;touch-action:manipulation}
.nextbtn{position:absolute;right:4px;bottom:2px;width:auto;min-height:36px;padding:2px 12px;border:none;background:transparent;color:#fff;animation:blink 1s steps(2) infinite;font-size:16px}
.clipbtn{display:inline;width:auto;min-height:0;padding:0;border:none;border-bottom:1px dotted #999;border-radius:0;background:transparent;text-align:left;font-size:inherit;color:inherit;line-height:inherit;touch-action:manipulation}
.speaker{position:absolute;top:-13px;left:10px;background:#000;padding:0 6px;font-size:13px;color:var(--cyan)}
.banner{font-weight:bold;color:var(--yel);animation:shake .5s;margin-bottom:4px}
.banner.bad{color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.head{font-size:13px;color:var(--cyan);margin-bottom:2px}
.sub{font-size:14px;color:var(--gray)}
.note{font-size:13px;color:var(--yel);margin-top:4px}
.ch{opacity:0;animation:ap 0s forwards}
@keyframes ap{to{opacity:1}}
.done .ch{animation:none!important;opacity:1}
.next{position:absolute;right:10px;bottom:4px;color:#fff;animation:blink 1s steps(2) infinite;font-size:14px}
@keyframes blink{50%{opacity:0}}
.cmds{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.qlist{display:flex;flex-direction:column;gap:6px}
.hint{font-size:13px;color:var(--gray)}
.ttl{color:var(--yel);font-size:14px;letter-spacing:.1em;margin-bottom:4px}
.small{font-size:13px;color:var(--gray)}
h1{font-size:30px;margin:28px 0 0;text-align:center;letter-spacing:.04em;line-height:1.2}
h1 small{display:block;font-size:15px;color:var(--yel);margin-top:6px;letter-spacing:.08em}
h2{font-size:18px;color:var(--yel);margin:4px 0;letter-spacing:.1em}
.foot{font-size:11px;color:#777;text-align:center;margin-top:auto;padding-top:12px}
/* map */
.town{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:2px solid #555;border-radius:6px;background:#1c1c1c;padding:8px 4px;text-align:center;font-size:13px;transition:background 1s,border-color 1s;position:relative;min-height:84px}
.tile .em{font-size:26px;filter:grayscale(1) brightness(.6);transition:filter 1s}
.tile .st{font-size:11px;color:var(--gray)}
.tile.boom{background:#5a4a00;border-color:var(--yel)}
.tile.boom .em{filter:none}
.tile.boom .st{color:var(--yel)}
.tile.soso{background:#33300f;border-color:#a89a3d}
.tile.soso .em{filter:grayscale(.4) brightness(.9)}
.tile .paper{position:absolute;top:4px;right:4px;font-size:10px;padding:1px 4px;border:1px solid;transform:rotate(6deg);background:#fff}
.tile.close .paper{color:#c00;border-color:#c00}
.tile.skip .paper,.tile.decline .paper{color:#246;border-color:#246}
.tile.cur{box-shadow:0 0 0 2px var(--cyan)}
.nigi{text-align:center;font-size:15px}
.nigi b{color:var(--yel);letter-spacing:3px}
/* memo */
.memohead{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin-bottom:6px}
.mh{border:1px solid #444;border-radius:4px;padding:6px}
.qb{border-top:1px solid #333;padding:6px 0}
.ql{font-size:12px;color:var(--cyan)}
.ar{font-size:14px;display:flex;gap:6px;padding:2px 0}
.ar .an{color:var(--gray);flex:0 0 3.2em}
.ar.dr{padding-left:14px}
.ar.dr .an{color:var(--yel)}
.clip{cursor:pointer;border-bottom:1px dotted #666}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:8px}
.overlay>.win{width:100%;max-width:464px;max-height:92vh;max-height:92dvh;overflow:auto;background:#000}
.rev li{margin:4px 0}
.kk{display:flex;gap:8px;padding:6px 0;border-top:1px solid #333;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;font-size:14px}
.kk.off{color:#9a9a9a}
.kk .n{flex:0 0 1.6em;color:var(--yel)}
.kk.off .n{color:#9a9a9a}
pre.copy{white-space:pre-wrap;font-size:12px;border:1px dashed #666;padding:8px;user-select:all;-webkit-user-select:all;color:#ccc}
.miss{border-top:1px solid #333;padding:6px 0;font-size:14px}
.miss .mn{color:var(--gray);font-size:13px}
.miss .mq{color:var(--cyan);font-size:13px}
@media (prefers-reduced-motion:reduce){.banner,.next,.nextbtn{animation:none}}
</style>
</head>

   ========================================================= */
const SAVE_KEY='mq_save_v1';
const $app=document.getElementById('app');
let state=null, queue=[], afterFn=null, onLastFn=null, lastAdvance=0;
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SPEED={normal:40,fast:15,none:0};
const SPEED_NAME={normal:'ふつう',fast:'はやい',none:'なし'};
function speed(){const s=LS.get('mq_speed'); if(s&&SPEED[s]!=null) return s; try{if(matchMedia('(prefers-reduced-motion: reduce)').matches) return 'none';}catch(e){} return 'normal';}
function newState(){return {phase:'title',shopIdx:0,records:[],cur:null,msg:null,msgId:0,msgDone:true,msgAt:0,hasMore:false,showCmds:false,overlay:null,partial:false,justFinished:null,plays:parseInt(LS.get('mq_plays')||'0',10)||0};}
const shopById=id=>DATA.shops.find(s=>s.id===id);
const appById=id=>{for(const s of DATA.shops){const a=s.applicants.find(x=>x.id===id); if(a) return a;} return null;};
const curShop=()=>DATA.shops[state.shopIdx];
const curApp=()=>curShop().applicants[state.cur.applicantIdx];
const curRec=()=>state.cur.recs[curApp().id];
function Q(id,shop){const q=DATA.questions.find(x=>x.id===id); if(q) return q; const s=shop||curShop(); return s.own.id===id?s.own:null;}
const qOrder=s=>['Q1','Q2','Q3','Q4',s.own.id,'Q5','Q6'];
const qMot=q=>q.type==='ng'?-30:(q.type==='fact'||q.type==='future'||q.type==='cond'||q.type==='plan')?10:0;
const hearts=m=>{const n=Math.max(0,Math.min(5,Math.floor(m/20))); return '<span class="hearts" title="しぼうど">'+'♥'.repeat(n)+'♡'.repeat(5-n)+'</span>';};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function changeMot(r,d){r.motivation=clamp(r.motivation+d,0,100);}
const canDeep=r=>!!r.lastQ&&!r.deepDone&&!r.done;

/* ---- message queue ---- */
function say(lines,opts){opts=opts||{}; queue=lines.slice(); afterFn=opts.after||null; onLastFn=opts.onLast||null; state.showCmds=false; showNext();}
function showNext(){const m=queue.shift(); state.msg=m; state.msgId++; state.msgDone=(speed()==='none'); state.msgAt=Date.now(); state.hasMore=queue.length>0; if(m&&m.enter&&state.cur) state.cur.entered=true; if(!state.hasMore&&onLastFn){const f=onLastFn; onLastFn=null; f();} render();}
function isTyping(){if(!state.msg||state.msgDone) return false; const n=(state.msg.text||'').length; return (Date.now()-state.msgAt)<n*SPEED[speed()]+150;}
function completeMsg(){state.msgDone=true; const b=document.getElementById('msgbox'); if(b) b.classList.add('done');}
function tapWindow(){const now=Date.now(); if(now-lastAdvance<200) return; if(isTyping()){completeMsg(); return;} if(state.hasMore){lastAdvance=now; showNext(); return;} if(afterFn){lastAdvance=now; const f=afterFn; afterFn=null; f();}}
function press(fn){if(isTyping()) completeMsg(); fn();}

/* ---- persistence ---- */
function persist(){if(!state||state.phase==='title') return; const s=Object.assign({},state,{msg:null,overlay:null,hasMore:false}); LS.set(SAVE_KEY,JSON.stringify({v:1,state:s}));}
function loadSave(){try{const j=JSON.parse(LS.get(SAVE_KEY)||'null'); if(j&&j.v===1&&j.state) return j.state;}catch(e){} return null;}

/* ---- flow ---- */
function startGame(){LS.del(SAVE_KEY); const plays=state.plays; state=newState(); state.plays=plays; state.phase='map'; persist(); render();}
function continueGame(){const s=loadSave(); if(!s){render(); return;} state=Object.assign(newState(),s); queue=[]; afterFn=null; onLastFn=null;
 if((state.phase==='ending'||state.phase==='review')&&state.records.length<DATA.shops.length){state.phase='map'; state.partial=false; state.cur=null; state.justFinished=null;}
 if(state.phase==='result') state.phase='memo';
 if(state.phase==='interview'){ if(!state.cur){state.phase='map';}
  else { const r=curRec();
   if(r.turnsLeft<=0&&!r.done){ state.msg={text:'めんせつの つづきじゃ。'}; state.msgDone=true; endInterview(false); return; }
   if(!state.cur.entered){ say([{text:'めんせつの つづきじゃ。'}].concat(enterLines(curApp())),{onLast:()=>{state.showCmds=true;}}); return; }
   state.msg={text:'めんせつの つづきじゃ。'}; state.msgDone=true; state.showCmds=true; } }
 render();}
function replay(){const plays=state.plays+1; LS.set('mq_plays',String(plays)); LS.del(SAVE_KEY); state=newState(); state.plays=plays; state.phase='map'; persist(); render();}
function toTitle(){state.phase='title'; state.overlay=null; render();}
function nextShop(){if(state.shopIdx>=DATA.shops.length){showEnding(false); return;} startShop();}
function startShop(){const s=curShop(); state.cur={shopId:s.id,applicantIdx:0,recs:{}}; s.applicants.forEach(a=>{state.cur.recs[a.id]={asked:[],deepOn:[],stars:[],motivation:a.motivation,resumeViewed:false,endedEarly:false,lastQ:null,deepDone:true,turnsLeft:DATA.turns,ngCount:0,done:false};});
 state.phase='interview'; state.justFinished=null; const msgs=[{text:s.name+' に やってきた。'}];
 if(state.shopIdx===0){ if(state.plays===0) DATA.tutorial.forEach(t=>msgs.push({speaker:'かいちょう',text:t})); else msgs.push({speaker:'かいちょう',text:DATA.tutorialShort}); }
 msgs.push.apply(msgs,enterLines(curApp())); say(msgs,{onLast:()=>{state.showCmds=true;}}); persist();}
function enterLines(a){return [{text:a.name+'（'+a.age+'）'+a.label+' が あらわれた！',enter:true},{head:'だいいちいんしょう',text:a.impression}];}
function enterApplicant(){state.phase='interview'; say(enterLines(curApp()),{onLast:()=>{state.showCmds=true;}}); persist();}
function finishTurn(msgs){const r=curRec(); if(r.turnsLeft<=0){say(msgs,{after:()=>endInterview(false)});} else {say(msgs,{onLast:()=>{state.showCmds=true;}});} persist();}
function ask(qid){const a=curApp(), r=curRec(); if(r.done||r.turnsLeft<=0||r.asked.includes(qid)) return; const q=Q(qid); if(!q) return;
 r.asked.push(qid); r.lastQ=qid; r.deepDone=false; r.turnsLeft--; const msgs=[];
 if(q.type==='ng'){ r.ngCount++; r.deepDone=true; changeMot(r,qMot(q)); const ng=DATA.ng[q.ngKind];
   if(q.ngKind==='blunt'){ msgs.push({speaker:a.name,banner:ng.banner,bad:true,head:q.label,text:ng.text,note:ng.note}); msgs.push({speaker:'かいちょう',text:ng.kaicho}); }
   else { msgs.push({speaker:a.name,head:q.label,text:ng.text,sub:ng.sub}); }
 } else { const ans=a.answers[qid]||{text:'……'}; const m=qMot(q); changeMot(r,m); msgs.push({speaker:a.name,head:q.label,text:ans.text,note:m>0?'しぼうどが あがった！':null}); }
 finishTurn(msgs);}
function deep(){const a=curApp(), r=curRec(); if(!canDeep(r)||r.turnsLeft<=0) return; const q=Q(r.lastQ); r.deepDone=true; r.deepOn.push(q.id); r.turnsLeft--;
 const prompt=DATA.deepPrompt[q.type]||DATA.deepPrompt.other; const ans=a.answers[q.id]; const d=ans&&ans.deep; const msgs=[];
 if(d){ const m=d.star?15:(d.motivation!=null?d.motivation:5); changeMot(r,m); if(d.star) r.stars.push(q.id); msgs.push({speaker:a.name,banner:d.star?'かいしんの しつもん！':null,head:'あなた「'+prompt+'」',text:d.text,note:m>0?'しぼうどが あがった！':null}); }
 else { changeMot(r,-5); msgs.push({speaker:a.name,head:'あなた「'+prompt+'」',text:q.shallow||'……',sub:'（答えは きれいな言葉の ままだった）',note:'しぼうどが さがった……'}); }
 finishTurn(msgs);}
function endInterview(early){const r=curRec(); if(r.done) return; if(early&&r.turnsLeft>0&&r.asked.length<=2) r.endedEarly=true; r.done=true; r.lastQ=null; state.overlay=null;
 if(state.cur.applicantIdx===0){state.cur.applicantIdx=1; enterApplicant();} else {state.phase='memo'; state.showCmds=false; persist(); render();}}
function openResume(){const r=curRec(); r.resumeViewed=true; state.overlay='resume'; persist(); render();}
function openMemo(){state.overlay='memo'; render();}
function closeOverlay(){state.overlay=null; render();}
function hire(id){const s=curShop(); const a=s.applicants.find(x=>x.id===id); const r=state.cur.recs[id]; if(!a||!r) return; state.phase='result'; state.overlay=null;
 if(r.motivation<DATA.declineBelow){ say([{text:a.name+'は ないていを じたいした。'},{speaker:a.name,text:r.ngCount>0?DATA.declineNg:DATA.declineText}],{after:()=>finishShop('decline',id)}); }
 else { const g=a.result.grade; say([{text:'半年後……'},{text:a.result.text,note:g==='close'?'商店街の ひょうばんが さがった……':null}],{after:()=>finishShop(g,id)}); }
 persist();}
function skipShop(){state.phase='result'; state.overlay=null; say([{text:'2人とも みおくりますか？',choices:[{label:'はい',act:'doSkip'},{label:'いいえ',act:'backMemo'}]}]);}
function backMemo(){state.phase='memo'; render();}
function doSkip(){const s=curShop(); say([{speaker:'かいちょう',text:DATA.skipKaicho},{text:s.name+'は 空き店舗のまま。しかし 商店街の ひょうばんは 守られた'}],{after:()=>finishShop('skip',null)});}
function finishShop(outcome,hiredId){const s=curShop(); state.records.push({shopId:s.id,outcome:outcome,hired:hiredId,applicants:state.cur.recs}); state.justFinished=s.id; state.cur=null; state.shopIdx++; state.phase='map'; persist(); render();}
function showEnding(partial){state.partial=!!partial; state.phase='ending'; state.overlay=null; persist(); render(); window.scrollTo(0,0);}
function showReview(){state.phase='review'; persist(); render(); window.scrollTo(0,0);}
function backEnding(){state.phase='ending'; render(); window.scrollTo(0,0);}

/* ---- stats / reviews ---- */
function stats(){const recs=state.records; const apps=[]; recs.forEach(r=>{const s=shopById(r.shopId); s.applicants.forEach(a=>{const x=r.applicants[a.id]; apps.push(Object.assign({},x,{id:a.id,data:a,shop:s,rec:r,hired:r.hired===a.id&&r.outcome!=='decline',grade:a.result.grade}));});});
 const S={recs,apps,shops:recs.length,total:DATA.shops.length};
 S.ngQ5=apps.some(a=>a.asked.includes('Q5')); S.ngQ6=apps.some(a=>a.asked.includes('Q6')); S.ngCount=apps.reduce((n,a)=>n+a.ngCount,0);
 S.reverse=apps.some(a=>(a.hired&&a.stars.length>0&&a.grade!=='boom')||(!a.hired&&a.stars.length>0&&a.grade==='boom'));
 S.hiredWe=apps.some(a=>a.hired&&a.data.tags.includes('we-subject')); S.hiredSolo=apps.some(a=>a.hired&&a.data.tags.includes('solo'));
 S.early=apps.some(a=>a.endedEarly);
 const hires=apps.filter(a=>a.hired&&a.rec.outcome!=='decline'); S.hires=hires.length; S.impHires=hires.filter(a=>a.data.good).length; S.starHires=hires.filter(a=>a.stars.length>0).length; S.noStarHires=hires.length-S.starHires;
 S.impression4=S.impHires>=4; S.noStar3=S.noStarHires>=3;
 S.skipGood=recs.some(r=>r.outcome==='skip'&&shopById(r.shopId).applicants.some(a=>a.result.grade==='boom'&&r.applicants[a.id].motivation>=DATA.declineBelow));
 S.declined=recs.filter(r=>r.outcome==='decline').length; S.deepTotal=apps.reduce((n,a)=>n+a.deepOn.length,0); S.noDeep=apps.length>0&&S.deepTotal===0;
 S.hypo3=recs.filter(r=>Object.values(r.applicants).some(x=>x.asked.includes('Q3'))).length>=3;
 S.resumeSkipped=apps.some(a=>!a.resumeViewed);
 S.lucky=recs.some(r=>{if(r.outcome!=='boom') return false; const s=shopById(r.shopId); const x=r.applicants[r.hired]; return x&&!['Q2','Q4',s.own.id].some(q=>x.asked.includes(q));});
 S.allSkip=recs.length===DATA.shops.length&&recs.every(r=>r.outcome==='skip'); S.allBoom=recs.length===DATA.shops.length&&recs.every(r=>r.outcome==='boom');
 S.boom=recs.filter(r=>r.outcome==='boom').length; S.starsFound=apps.reduce((n,a)=>n+a.stars.length,0); S.resumeViewed=apps.filter(a=>a.resumeViewed).length;
 S.score=recs.reduce((n,r)=>n+(DATA.score[r.outcome]||0),0)+S.starsFound*DATA.score.star+S.ngCount*DATA.score.ng;
 const max=Math.max(1,recs.length*5); S.ratio=S.score/max; S.title=(DATA.titles.find(t=>S.ratio>=t.min)||DATA.titles[DATA.titles.length-1]).name;
 S.ending=(DATA.endings.find(e=>(S.boom/DATA.shops.length)>=e.min)||DATA.endings[DATA.endings.length-1]).text;
 const starVia=t=>apps.reduce((n,a)=>n+a.stars.filter(q=>{const qq=Q(q,a.shop); return qq&&(t==='Q2'?q==='Q2':t==='Q4'?q==='Q4':!!qq.tellsCondition);}).length,0);
 S.k={allResume:apps.length>0&&apps.every(a=>a.resumeViewed), starQ2x2:starVia('Q2')>=2, weNotHired:apps.some(a=>a.data.tags.includes('we-subject')&&a.deepOn.includes('Q2')&&!a.hired), starQ4:starVia('Q4')>=1, starCond:starVia('cond')>=1, noNg:S.ngCount===0, noDecline:S.declined===0};
 S.missed=apps.filter(a=>a.stars.length===0).map(a=>{const qid=Object.keys(a.data.answers).find(k=>a.data.answers[k].deep&&a.data.answers[k].deep.star); return {a,qid,q:Q(qid,a.shop),text:a.data.answers[qid].deep.text};});
 S.reviews=S.allBoom?[]:DATA.reviews.filter(r=>!!S[r.when]);
 return S;}

function spans(t){const ms=SPEED[speed()]; if(ms===0) return esc(t); let h='',i=0; for(const c of t){h+='<span class="ch" style="animation-delay:'+(i*ms)+'ms">'+esc(c)+'</span>'; i++;} return h;}
function msgHTML(m){if(!m) return ''; const t=m.speaker?'「'+m.text+'」':m.text; const n=t.length*SPEED[speed()];
 let h='<div class="win msg'+(state.msgDone?' done':'')+'" id="msgbox" data-act="tap">';
 if(m.speaker) h+='<div class="speaker">'+esc(m.speaker)+'</div>';
 if(m.banner) h+='<div class="banner'+(m.bad?' bad':'')+'">'+esc(m.banner)+'</div>';
 if(m.head) h+='<div class="head">'+esc(m.head)+'</div>';
 h+='<div class="text">'+spans(t)+'</div>';
 if(m.sub) h+='<div class="sub ch" style="animation-delay:'+n+'ms">'+esc(m.sub)+'</div>';
 if(m.note) h+='<div class="note ch" style="animation-delay:'+(n+100)+'ms">▲ '+esc(m.note)+'</div>';
 if(state.hasMore||afterFn) h+='<button class="nextbtn" data-act="tap" aria-label="つぎへ">▼</button>';
 h+='</div>';

function topbar(left){return '<div class="topbar"><span>'+left+'</span><button class="sp" data-act="speed" aria-label="もじおくり切り替え">もじおくり：'+SPEED_NAME[speed()]+'</button></div>';}

 qOrder(s).forEach(qid=>{const q=Q(qid,s); if(!apps.some(a=>recs[a.id].asked.includes(qid))) return; h+='<div class="qb"><div class="ql">'+esc(q.label)+(showTypes?'　<span class="small">['+esc({basic:'定番',fact:'行動事実',hypo:'仮定',future:'継続意思',cond:'条件',plan:'具体策',ng:'NG'}[q.type]||q.type)+']</span>':'')+'</div>';

};
$app.addEventListener('click',e=>{const cl=e.target.closest('.clipbtn'); if(cl){const open=cl.dataset.open==='1'; cl.textContent=open?cl.dataset.short:cl.dataset.full; cl.dataset.open=open?'0':'1'; cl.setAttribute('aria-label',open?'全文を見る':'短くする'); e.stopPropagation(); return;}
 const stop=e.target.closest('[data-stop]'); const el=e.target.closest('[data-act]'); if(!el) return; if(stop&&el.classList.contains('overlay')) return; const act=el.dataset.act; if(ACT[act]) ACT[act](el.dataset.arg);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){ if(state.overlay) return; if(e.target&&e.target.closest&&e.target.closest('button,a,[tabindex]')) return; const b=document.getElementById('msgbox'); if(b){e.preventDefault(); tapWindow();} }});
state=newState(); render();
</script>
</body>
</html>
